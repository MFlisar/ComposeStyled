# -----------------------
# Update GitHub Pages
# - builds Dokka and optionally the Wasm demo
# - demo enabled: landing page, Dokka at /api/, demo at /demo/
# - demo disabled: Dokka directly at the site root
# - deploys the artifact to GitHub Pages
# -----------------------

name: Update GitHub Pages

on:
  push:
    branches: [ main, master ]

env:
  JAVA_VERSION: "17"                                    # required
  DOKKA_GRADLE_TASK: ":dokka:dokkaGenerate"             # required
  DOKKA_HTML_PATH: "library/dokka/build/dokka/html"     # required
  DEMO_TASK: ":demo:app:compose:wasmJsBrowserDistribution" # optional; empty disables the demo
  DEMO_HTML_PATH: "demo/app/compose/build/dist/wasmJs/productionExecutable"
  PAGE_TITLE: "Compose Styled Components"

permissions:
  contents: read

jobs:
  build-dokka:
    name: Build Dokka
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Grant Permission to Execute Gradle
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v3

      - name: Build Dokka HTML
        run: ./gradlew "$DOKKA_GRADLE_TASK"

      - name: Upload Dokka artifact
        uses: actions/upload-artifact@v4
        with:
          name: dokka-html
          path: ${{ env.DOKKA_HTML_PATH }}
          if-no-files-found: error

  build-demo:
    name: Build Wasm demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.DEMO_TASK != '' }}
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        if: ${{ env.DEMO_TASK != '' }}
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Grant Permission to Execute Gradle
        if: ${{ env.DEMO_TASK != '' }}
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v3
        if: ${{ env.DEMO_TASK != '' }}

      - name: Build Wasm demo
        if: ${{ env.DEMO_TASK != '' }}
        env:
          INCLUDE_DEMO_MODULES: "true"
        run: ./gradlew "$DEMO_TASK"

      - name: Upload Wasm demo artifact
        if: ${{ env.DEMO_TASK != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: wasm-demo
          path: ${{ env.DEMO_HTML_PATH }}
          if-no-files-found: error

  publish-pages:
    name: Publish GitHub Pages
    runs-on: ubuntu-latest
    needs:
      - build-dokka
      - build-demo
    if: >-
      ${{
        always() &&
        needs.build-dokka.result == 'success' &&
        (needs.build-demo.result == 'success' || needs.build-demo.result == 'skipped')
      }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Dokka artifact
        uses: actions/download-artifact@v4
        with:
          name: dokka-html
          path: ${{ runner.temp }}/dokka-html

      - name: Download Wasm demo artifact
        if: ${{ env.DEMO_TASK != '' }}
        uses: actions/download-artifact@v4
        with:
          name: wasm-demo
          path: ${{ runner.temp }}/wasm-demo

      - name: Prepare GitHub Pages
        shell: bash
        env:
          PAGES_PATH: ${{ runner.temp }}/github-pages
          DOKKA_INPUT_PATH: ${{ runner.temp }}/dokka-html
          DEMO_INPUT_PATH: ${{ runner.temp }}/wasm-demo
        run: |
          set -euo pipefail
          test -f "$DOKKA_INPUT_PATH/index.html"
          mkdir -p "$PAGES_PATH"

          if [[ -n "$DEMO_TASK" ]]; then
            test -f "$DEMO_INPUT_PATH/index.html"
            mkdir -p "$PAGES_PATH/api" "$PAGES_PATH/demo"
            cp -a "$DOKKA_INPUT_PATH/." "$PAGES_PATH/api/"
            cp -a "$DEMO_INPUT_PATH/." "$PAGES_PATH/demo/"
            cat > "$PAGES_PATH/index.html" <<HTML
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta name="color-scheme" content="dark">
              <title>${PAGE_TITLE}</title>

              <link rel="preconnect" href="https://fonts.googleapis.com">
              <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
              <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Material+Symbols+Rounded" rel="stylesheet">

              <style>
                :root {
                  --bg: #202124;
                  --card: #0f1115;
                  --border: #303134;
                  --border-hover: #5f6368;
                  --text: #e8eaed;
                  --text-secondary: #9aa0a6;
                  --accent: #8ab4f8;
                }

                * {
                  box-sizing: border-box;
                }

                body {
                  margin: 0;
                  min-height: 100vh;
                  background: var(--bg);
                  color: var(--text);
                  font-family: Roboto, Arial, sans-serif;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  padding: 24px;
                }

                .card {
                  width: min(900px, 100%);
                  background: var(--card);
                  border: 1px solid var(--border);
                  border-radius: 28px;
                  overflow: hidden;
                  box-shadow: 0 8px 32px rgba(0, 0, 0, .35);
                }

                .content {
                  display: grid;
                  grid-template-columns: 1fr 440px;
                  gap: 48px;
                  padding: 48px;
                }

                .title {
                  margin: 0;
                  font-size: 3rem;
                  font-weight: 400;
                  line-height: 1.1;
                  letter-spacing: -.02em;
                }

                .subtitle {
                  margin-top: 24px;
                  color: var(--accent);
                  font-size: 1.1rem;
                }

                .menu {
                  display: flex;
                  flex-direction: column;
                }

                .menu-item {
                  display: flex;
                  align-items: center;
                  gap: 16px;
                  min-height: 84px;
                  padding: 16px 20px;
                  color: inherit;
                  text-decoration: none;
                  border: 1px solid transparent;
                  border-radius: 999px;
                  transition:
                    background-color .15s ease,
                    border-color .15s ease,
                    transform .15s ease;
                }

                .menu-item:hover {
                  background: rgba(255, 255, 255, .035);
                  border-color: var(--border-hover);
                  transform: translateX(4px);
                }

                .menu-item + .menu-item {
                  margin-top: 12px;
                }

                .icon {
                  width: 48px;
                  height: 48px;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  border-radius: 50%;
                  background: #1d2128;
                  color: var(--accent);
                  flex-shrink: 0;
                }

                .material-symbols-rounded {
                  font-size: 24px;
                }

                .item-content {
                  flex: 1;
                  min-width: 0;
                }

                .item-title {
                  font-size: 1.1rem;
                  font-weight: 500;
                  color: var(--text);
                }

                .item-description {
                  margin-top: 4px;
                  font-size: .9rem;
                  color: var(--text-secondary);
                }

                .arrow {
                  color: var(--text-secondary);
                }

                @media (max-width: 900px) {
                  .content {
                    grid-template-columns: 1fr;
                  }

                  .title {
                    font-size: 2.25rem;
                  }
                }
              </style>
            </head>

            <body>
              <main class="card">
                <div class="content">
                  <section>
                    <h1 class="title">${PAGE_TITLE}</h1>
                    <div class="subtitle">Select a sub page</div>
                  </section>

                  <nav class="menu" aria-label="Project resources">
                    <a class="menu-item" href="./api/">
                      <span class="icon">
                        <span class="material-symbols-rounded">menu_book</span>
                      </span>
                      <span class="item-content">
                        <div class="item-title">API Documentation</div>
                        <div class="item-description">
                          Browse the generated Dokka reference
                        </div>
                      </span>
                      <span class="material-symbols-rounded arrow">chevron_right</span>
                    </a>

                    <a class="menu-item" href="./demo/">
                      <span class="icon">
                        <span class="material-symbols-rounded">palette</span>
                      </span>
                      <span class="item-content">
                        <div class="item-title">Live Demo</div>
                        <div class="item-description">
                          Open the interactive Wasm showcase
                        </div>
                      </span>
                      <span class="material-symbols-rounded arrow">chevron_right</span>
                    </a>
                  </nav>
                </div>
              </main>
            </body>
          </html>
          HTML
          else
            cp -a "$DOKKA_INPUT_PATH/." "$PAGES_PATH/"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
