[versions]

# general (local snapshot: "LOCAL-SNAPSHOT")
kmp-parcelize =             "2.0.0"
kmp-platformcontext =       "2.0.2"
kmp-mail =                  "1.0.0"
cachefileprovider =         "1.0.0"
kotpreferences =        	"4.0.1"
lumberjack =                "12.0.0"
composedebugdrawer =		"4.0.0"
composechangelog =   		"4.0.0"
composepreferences =   		"3.0.0"
composethemer =   			"2.0.0"
composecolors =             "2.0.0"

composedialogs =   		    "5.0.0-alpha06"
composetable =              "0.0.1-alpha06"

# plugins only
kmpicon =                   "1.0.0"
kmpdevtools =               "9.3.7" # use the "devTools" task to change the version

# demos
democomposables =           "1.0.5"

[plugins]

# general
changelog-gradleplugin =            { id = "io.github.mflisar.composechangelog.gradle-plugin",          version.ref = "composechangelog" }

# plugins only
kmpdevtools-buildplugin =           { id = "io.github.mflisar.kmpdevtools.plugins-build-gradle",        version.ref = "kmpdevtools" }
kmpicon-plugin =                    { id = "io.github.mflisar.kmpicon.plugin",                          version.ref = "kmpicon" }

[libraries]

# general
kmp-parcelize =                                 { module = "io.github.mflisar.kmpparcelize:library", 	                            version.ref = "kmp-parcelize" }
kmp-platformcontext-core =                      { module = "io.github.mflisar.kmpplatformcontext:core", 	                        version.ref = "kmp-platformcontext" }
