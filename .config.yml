# ---------------------
# Publishing configuration
# ---------------------

publish:
  group-id: io.github.mflisar.composestyledcomponents
  github:
    user: MFlisar
    repo: maven-repository
    branch: main
    path: artifacts
  target: maven-central # [none, maven-central, github]

# ---------------------
# General configuration
# ---------------------

config:
  java-version: 17
  developer:
    name: Michael Flisar
    mail: mflisar.development@gmail.com
    maven-id: mflisar
    github-user-name: MFlisar

# ---------------------
# Project
# ---------------------

project:
  namespace: com.michaelflisar.composestyledcomponents
  repo-name: ComposeStyledComponents
  release: 2026
  license:
    name: Apache License 2.0
    path: blob/main/LICENSE

# ---------------------
# APP / DEMO (optional)
# ---------------------

apps:
  - name: Compose Styled Components Demo
    namespace: com.michaelflisar.composestyledcomponents.demo
    version-name: 1.0.0
    module-paths:
      - demo/app/web
      - demo/app/windows
      - demo/shared
    # optional - if set, the app will be published to the homepage and linked in the readme
    publish:
      url-path: demo
      description: Explore the interactive demo
      module-path: demo/app/web

# ---------------------
# Modules
# ---------------------

modules:
  # used to detect latest release version of the library (dynamically on the published homepage)
  primary-artifact-id: core
  # Modules - list of modules [artifact-id, description, path, (plugin)]
  modules:
    - artifact-id: core
      description: the core module
      path: library/core
    - artifact-id: foundation
      description: a foundation implementation (can be used as a base for other implementations)
      path: library/implementations/foundation
    - artifact-id: cupertino
      description: a cupertino implementation
      path: library/implementations/cupertino
    - artifact-id: fluent2
      description: a fluent2 implementation
      path: library/implementations/fluent2
    - artifact-id: material3
      description: a material3 implementation
      path: library/implementations/material3
  # XCFrameworks [name, path, targets (ios, macos)]
  xcframeworks: []

# ---------------------
# Readme Generation
# ---------------------

documentation:
  path: documentation
  relative-paths:
    partials: _partials
    screenshots: screenshots
    main-screenshot: # screenshots/main.png