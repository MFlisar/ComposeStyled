# ---------------------
# Publishing configuration
# ---------------------

publish:
  group-id: io.github.mflisar.composestyled
  github:
    user: MFlisar
    repo: maven-repository
    branch: main
    path: artifacts
  release-target: maven-central # [none, maven-central, github]
  test-target: github # [none, maven-central, github]

# ---------------------
# General configuration
# ---------------------

config:
  java-version: 17
  developer:
    name: Michael Flisar
    mail: mflisar.development@gmail.com
    maven-id: mflisar
    github-user-name: MFlisar

# ---------------------
# Project
# ---------------------

project:
  namespace: com.michaelflisar.composestyled
  repo-name: ComposeStyled
  release: 2026
  license:
    name: Apache License 2.0
    path: blob/main/LICENSE

# ---------------------
# APP / DEMO (optional)
# ---------------------

apps:
  - name: Compose Styled Demo
    namespace: com.michaelflisar.composestyled.demo
    version-name: 1.0.0
    module-paths:
      - demo/app/wasm
      - demo/app/jvm
      - demo/app/android
      - demo/shared
    # optional - if set, the app will be published to the homepage and linked in the readme
    publish:
      url-path: demo
      description: Explore the interactive demo
      module-path: demo/app/wasm

# ---------------------
# Modules
# ---------------------

modules:
  # used to detect latest release version of the library (dynamically on the published homepage)
  primary-artifact-id: core
  # Modules - list of modules [artifact-id, description, path, (plugin)]
  modules:
    - artifact-id: core
      description: the core module
      path: library/core
    - artifact-id: foundation
      description: a foundation implementation (can be used as a base for other implementations)
      path: library/implementations/foundation
    - artifact-id: cupertino-flat
      description: a flat Cupertino implementation
      path: library/implementations/cupertino-flat
    - artifact-id: cupertino-liquid
      description: a Liquid Glass Cupertino implementation
      path: library/implementations/cupertino-liquid
    - artifact-id: fluent2
      description: a fluent2 implementation
      path: library/implementations/fluent2
    - artifact-id: material3
      description: a material3 implementation
      path: library/implementations/material3
    - artifact-id: iconset-material3
      description: Material icon sets
      path: library/iconsets/material3
    - artifact-id: iconset-fluent2
      description: Fluent 2 icon sets
      path: library/iconsets/fluent2
    - artifact-id: iconset-sfsymbols
      description: SF Symbols icon set
      path: library/iconsets/sfsymbols
    - artifact-id: theme-cupertino
      description: cupertino color themes
      path: library/themes/cupertino
    - artifact-id: theme-fluent2
      description: fluent2 color themes
      path: library/themes/fluent2
    - artifact-id: theme-material3
      description: material3 color themes
      path: library/themes/material3
    - artifact-id: theme-pastel
      description: pastel color themes
      path: library/themes/pastel
    - artifact-id: theme-nature
      description: nature color themes
      path: library/themes/nature
    - artifact-id: styled-composedialog
      description: a styled implementation for ComposeDialogs
      path: library/libraries/composedialogs
    - artifact-id: styled-composepreferences
      description: a styled implementation for ComposePreferences
      path: library/libraries/composepreferences
    - artifact-id: styled-composetable
      description: a styled implementation for ComposeTable
      path: library/libraries/composetable

  # XCFrameworks [name, path, targets (ios, macos)]
  xcframeworks: []

# ---------------------
# Readme Generation
# ---------------------

documentation:
  path: documentation
  relative-paths:
    partials: _partials
    screenshots: screenshots
    main-screenshot: # screenshots/main.png